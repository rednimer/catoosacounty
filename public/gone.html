<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Body for HTTP 410 responses. Served on many removed URLs, so it must not
      declare a canonical (that would collapse them onto one address) and must
      not load analytics.
    -->
    <meta name="robots" content="noindex" />
    <title>Page removed | Catoosa County Storage</title>
    <meta name="theme-color" content="#0e3a5c" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        background: #f5fafd;
        color: #1e2a34;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 4.5rem 1.25rem;
      }
      p.brand {
        margin: 0;
        color: #14496c;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      p.note {
        margin: 1rem 0 0;
        color: #444f58;
        font-size: 1.05rem;
        line-height: 1.5;
      }
      a {
        color: #14496c;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Catoosa County Storage</p>
      <h1>This page has been removed</h1>
      <p class="note">That address is permanently gone.</p>
      <p class="note"><a href="/">Back to the homepage</a></p>
    </main>
  </body>
</html>
